<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Voice Tester</title>
<style>
  :root { font-family: system-ui, Arial, sans-serif; color: #222; }
  body { max-width: 760px; margin: 32px auto; padding: 0 16px; background: #faf8f5; }
  main { background: white; padding: 24px; border-radius: 18px; box-shadow: 0 5px 24px #0000000d; }
  h1 { margin-top: 0; }
  label { display: block; font-weight: 650; margin: 16px 0 7px; }
  select, textarea, input { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #d7d2cb; border-radius: 10px; font: inherit; }
  textarea { min-height: 105px; resize: vertical; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  button { padding: 10px 15px; border: 0; border-radius: 10px; background: #302d38; color: white; font: inherit; cursor: pointer; }
  button.secondary { background: #eeeaf3; color: #302d38; }
  .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .hint { color: #666; font-size: .92rem; line-height: 1.5; }
  #status { margin-top: 12px; color: #5a4b75; }
  @media (max-width: 520px) { .settings { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>🎙️ Browser Voice Tester</h1>
  <p>Choose a voice installed in your browser/device, then press Play to hear it read English aloud.</p>
  <label for="voice">Available voices</label>
  <select id="voice"></select>
  <p class="hint">The list depends on your browser and operating system. Some voices may need an internet connection.</p>
  <label for="text">Text to listen to</label>
  <textarea id="text">Welcome to Moonlight Mansion. Something strange happened last night. Can you solve the mystery?</textarea>
  <div class="settings">
    <div>
      <label for="rate">Speaking speed: <span id="rateValue">0.9</span></label>
      <input id="rate" type="range" min="0.6" max="1.3" step="0.1" value="0.9">
    </div>
    <div>
      <label for="pitch">Pitch: <span id="pitchValue">1.0</span></label>
      <input id="pitch" type="range" min="0.5" max="1.7" step="0.1" value="1">
    </div>
  </div>
  <div class="buttons">
    <button id="play">▶ Play voice</button>
    <button id="stop" class="secondary">■ Stop</button>
    <button id="refresh" class="secondary">↻ Refresh voices</button>
  </div>
  <p id="status" role="status">Loading available voices…</p>
</main>
<script>
const voiceSelect = document.getElementById('voice');
const textBox = document.getElementById('text');
const rate = document.getElementById('rate');
const pitch = document.getElementById('pitch');
const status = document.getElementById('status');
let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();
  const previous = voiceSelect.value;
  voiceSelect.innerHTML = '';
  if (!voices.length) {
    const opt = document.createElement('option');
    opt.textContent = 'No voices detected yet — try Refresh voices';
    opt.value = '';
    voiceSelect.appendChild(opt);
    status.textContent = 'No voices detected yet. Try Refresh voices, or open this page in Chrome/Edge.';
    return;
  }
  voices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = `${v.name} — ${v.lang}${v.default ? ' (default)' : ''}`;
    voiceSelect.appendChild(opt);
  });
  const englishIndex = voices.findIndex(v => /^en(-|_)/i.test(v.lang));
  if (previous && voices[Number(previous)]) voiceSelect.value = previous;
  else if (englishIndex >= 0) voiceSelect.value = String(englishIndex);
  status.textContent = `${voices.length} voice(s) found. Choose one and press Play.`;
}
document.getElementById('play').addEventListener('click', () => {
  const text = textBox.value.trim();
  if (!text) { status.textContent = 'Type something to listen to first.'; return; }
  if (!('speechSynthesis' in window)) { status.textContent = 'Speech synthesis is not supported by this browser.'; return; }
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  const chosen = voices[Number(voiceSelect.value)];
  if (chosen) { utterance.voice = chosen; utterance.lang = chosen.lang; }
  utterance.rate = Number(rate.value);
  utterance.pitch = Number(pitch.value);
  utterance.onstart = () => status.textContent = `Playing: ${chosen ? chosen.name + ' (' + chosen.lang + ')' : 'default voice'}`;
  utterance.onend = () => status.textContent = 'Finished. Choose another voice to compare.';
  utterance.onerror = e => status.textContent = 'Playback error: ' + e.error + '. Try another voice or browser.';
  speechSynthesis.speak(utterance);
});
document.getElementById('stop').addEventListener('click', () => {
  speechSynthesis.cancel();
  status.textContent = 'Stopped.';
});
document.getElementById('refresh').addEventListener('click', loadVoices);
rate.addEventListener('input', () => document.getElementById('rateValue').textContent = rate.value);
pitch.addEventListener('input', () => document.getElementById('pitchValue').textContent = Number(pitch.value).toFixed(1));
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
} else {
  status.textContent = 'This browser does not support speechSynthesis.';
  document.getElementById('play').disabled = true;
}
</script>
</body>
</html>
